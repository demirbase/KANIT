# ============================================================================
# amr.sif — the analysis environment of KANIT v1.0 (plan F6, K9)
# ============================================================================
# The Python stack of every step and the tools the steps call from Python:
# unitig-caller (Bifrost) for the unitigs, PopPUNK (graph-tool) for the lineages and
# RGI (DIAMOND, BLAST+) for the CARD annotation. amr.def feeds it to mamba; the lock
# file (environment.lock.yml) is exported from the built container.
#   conda env create -f environment.yml
# Versions: the development containers (F6.1) use these; the final containers (F6.2)
# take the newest mutually compatible versions and freeze them.
# - graph-tool is pinned on its own: PopPUNK's clustering changed when graph-tool went
#   from 2.98 to 3.0 with PopPUNK unchanged, and the lineages define the CV groups.
# - BLAST+ comes with RGI (which pins 2.16.0); amr-tools pins the same version.
# - scikit-learn is pinned because the fold split depends on it (K4).
# ============================================================================
name: amr-prediction
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.13
  - pandas=3.0.3
  - numpy=2.5.0
  - scipy=1.18.0
  - scikit-learn=1.9.0
  - xgboost=3.2.0
  - optuna=4.9.0
  - joblib=1.5.3
  - matplotlib=3.11.0
  - seaborn=0.13.2
  - biopython=1.87
  - pyyaml=6.0.3
  - tqdm=4.68.3
  - certifi=2026.6.17     # CA bundle for the BV-BRC API (00a)
  - setuptools=80.10.2
  - unitig-caller=1.3.2   # unitigs (Bifrost)
  - poppunk=2.7.8         # lineages
  - graph-tool=3.0        # PopPUNK's network backend, pinned (see above)
  - rgi=6.0.8             # CARD annotation (08), with DIAMOND and BLAST+ 2.16.0
  - pytest=9.1.1
