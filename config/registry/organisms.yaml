# ============================================================================
# ORGANISM REGISTRY
# ============================================================================
# One block per organism; adding an organism means adding a block here, with no
# code change. Read through scripts/lib/registry.py.
#
# The panel (which organism–antibiotic pairs are modelled) is not listed here.
# It follows from the panel rule applied to the data: 02e_panel.py writes
# results/panel/panel_decisions.csv.
#
# Fields:
#   display_name        scientific name, as shown in tables and figures
#   amrfinder_organism  AMRFinderPlus --organism (enables its point mutations; step 16)
#   resfinder_species   ResFinder -s (selects its PointFinder database; step 16)
#   taxids              NCBI taxonomy IDs of the organism: its genomes are the BV-BRC
#                       genomes at or below these taxa (protocol §2.1)
#   gram_stain, phylum  reference data for the knowledge base
#   lineage             optional PopPUNK overrides of config.yaml `lineage:`
# Slugs are lowercase snake_case: they become path components.
# ============================================================================
schema_version: "3.0"

organisms:
  ecoli:
    display_name: "Escherichia coli"
    amrfinder_organism: Escherichia
    resfinder_species: "Escherichia coli"
    taxids: [562]
    gram_stain: negative
    phylum: Pseudomonadota

  kpneumoniae:
    display_name: "Klebsiella pneumoniae"
    amrfinder_organism: Klebsiella_pneumoniae
    resfinder_species: "Klebsiella"
    taxids: [573]
    gram_stain: negative
    phylum: Pseudomonadota

  staphylococcus_aureus:
    display_name: "Staphylococcus aureus"
    amrfinder_organism: Staphylococcus_aureus
    resfinder_species: "Staphylococcus aureus"
    taxids: [1280]
    gram_stain: positive
    phylum: Bacillota
    # PopPUNK override. What IS established: S. aureus is the panel's most clonal
    # collection — 2,633 assemblies resolve into 42 lineages, the fewest of any
    # organism here (Ab 122, Ec 292, Efm 394, Kp 529, Pa 329).
    # NOT MEASURED (2026-09-14 audit): no S. aureus fit at 10^4 was ever run, so this
    # is a configuration choice, not a demonstrated requirement. The only sketch-size
    # pair in the repo is A. baumannii — poppunk_clusters_s1e5.csv 61 lineages /
    # largest 76.4% vs poppunk_clusters_bgmm.csv 59 / 76.3% — i.e. 10^5 changed
    # almost nothing there (fit model not controlled, so not conclusive either).
    # The old rationale cited docs/literature/E3.md §4, which traces back to the
    # PopPUNK paper; that paper gives 10^5 for M. tuberculosis, not for S. aureus.
    # Keep 10^5 for continuity with the delivered labels, not because a source requires it.
    lineage:
      sketch_size: 100000

  acinetobacter_baumannii:
    display_name: "Acinetobacter baumannii"
    amrfinder_organism: Acinetobacter_baumannii
    resfinder_species: "Acinetobacter baumannii"
    taxids: [470]
    gram_stain: negative
    phylum: Pseudomonadota
    # PopPUNK (docs/literature/E3.md §5): A. baumannii needs no special model or
    # sketch tuning — defaults resolve GC1/GC2 well — EXCEPT a length filter
    # narrowed to its genome size (~3.9 Mb), because its extreme plasmid/integron
    # plasticity makes contamination easy to mistake for accessory content.
    # PopPUNK override — MEASURED 2026-07-16, the ONLY organism that needs one.
    # A. baumannii clinical AMR collections are dominated by the GC2 high-risk
    # clone, and plain dbscan puts 76.3 % of the genomes in a single lineage —
    # useless for GroupKFold (one fold would hold 76 % of the data). Boundary
    # refinement splits it: 76.3 % -> 52.1 % largest lineage (60 -> 84 lineages).
    #
    # Sketch size does NOT help here (tested: 10^4 -> 10^5 moved it 76.3 -> 76.4 %),
    # unlike S. aureus — the GC2 clone is genuinely tight, not under-resolved. bgmm
    # was also tested and made no difference (76.3 %).
    #
    # 52 % is still the panel's worst balance and reflects real biology, not a bad
    # setting; A. baumannii's lineage-CV is correspondingly the most conservative.
    # Say so in the Methods rather than hiding it.
    lineage:
      refine: true
    # length_range NOT SET, but now derivable: genomes ARE downloaded (2026-07-16),
    # so the observed assembly-length distribution can be measured (E3 §5 wants it
    # narrowed to ~3.9 Mb). Left empty until measured rather than guessed; the
    # global `length_sigma: 5` filters length outliers adaptively meanwhile, so
    # this is a refinement, not a blocker.

  pseudomonas_aeruginosa:
    display_name: "Pseudomonas aeruginosa"
    amrfinder_organism: Pseudomonas_aeruginosa
    resfinder_species: "Pseudomonas aeruginosa"
    taxids: [287]
    gram_stain: negative
    phylum: Pseudomonadota

  enterococcus_faecium:
    display_name: "Enterococcus faecium"
    amrfinder_organism: Enterococcus_faecium
    resfinder_species: "Enterococcus faecium"
    taxids: [1352]
    gram_stain: positive
    phylum: Bacillota

  enterobacter_cloacae:
    display_name: "Enterobacter cloacae complex"
    amrfinder_organism: Enterobacter_cloacae
    resfinder_species: "Enterobacter cloacae"
    taxids: [550, 61645, 158836, 1812935, 299767, 881260]
    gram_stain: negative
    phylum: Pseudomonadota
