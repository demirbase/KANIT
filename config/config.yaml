# ============================================================================
# AMR PREDICTION PROJECT CONFIGURATION FILE
# ============================================================================
# This YAML file contains all configurable parameters for the antimicrobial
# resistance prediction pipeline. Modify these values to customize the
# analysis for different antibiotics, organisms, or computational resources.
#
# Purpose: Centralized configuration for reproducibility and easy parameter tuning
# Date: 2025
# ============================================================================

# ----------------------------------------------------------------------------
# PROJECT METADATA
# ----------------------------------------------------------------------------
project:
  name: "KANIT"
  description: "Machine learning-based antimicrobial resistance prediction using unitig features"
  target_antibiotic: "ampicillin"  # Primary antibiotic for analysis
  organism: "ecoli"  # Organism registry slug (see config/registry/organisms.yaml)
  # Human-readable names live in the registry (organisms.yaml `display_name`),
  # which is what the code reads — there is deliberately no `organism_display`
  # key here to drift out of sync with it.
  model: "xgboost"  # ML model
  version: "1.0.0"  # aligned to the KB schema (lib/kb_schema.KB_SCHEMA_VERSION)

# Registry file locations are NOT configurable: lib/registry.py resolves
# config/registry/{organisms,antibiotics}.yaml relative to PROJECT_ROOT. An
# earlier `registry:` block here listed those paths as if they were settings —
# editing them changed nothing, which is worse than not offering the knob.

# ----------------------------------------------------------------------------
# DIRECTORY PATHS — organism-aware templates ({organism}/{antibiotic})
# ----------------------------------------------------------------------------
# Consumed by scripts/lib/config.py resolve_path(). Every numbered script now
# resolves its paths from here. (The legacy single-organism `paths:` block was
# removed 2026-07-13 — it was dead: paths_organism is a superset and resolve_path
# checks it first, so the fallback never triggered.)
paths_organism:
  # ── Global / shared (organism-independent — NOT moved by the migration) ────
  data_dir:               "data"

  # Global QC / validation outputs are now ORGANISM-SCOPED so two organisms do
  # not overwrite each other's validation_report.txt / global_qc_outliers.csv.
  dir_global_exploration: "results/{organism}/global_exploration"
  # CheckM2 + QUAST per-genome QC (02d); 02e reads its table.
  genome_qc_dir:          "results/{organism}/global_exploration/genome_qc"
  # The panel (02e): one decision per organism–antibiotic pair.
  panel_dir:              "results/panel"

  # ── Organism-scoped ────────────────────────────────────────────────────────
  raw_genomes_dir:  "data/raw/{organism}/genomes"
  metadata_file:    "data/external/{organism}/metadata/amr_phenotypes.csv"
  # PopPUNK lineage labels (02c) — organism-level, antibiotic-independent (one
  # clustering reused by every antibiotic's lineage-aware CV).
  lineage_dir:      "data/processed/{organism}/lineage"

  # ── Organism + antibiotic-scoped ───────────────────────────────────────────
  # Organism unitig store and per-model pattern matrices (03u, lib/matrix_store.py).
  unitig_store_dir:     "data/processed/{organism}/unitig_store"
  matrix_dir:           "data/processed/{organism}/{antibiotic}/model_matrix"
  # Nested cross-validation and final model of one pair (04_nested_cv.py).
  cv_dir:               "results/{organism}/{antibiotic}/cv"
  # CARD layer: RGI database, RGI hits of every genome, candidates and their state.
  rgi_db_dir:           "data/external/rgi_db"
  rgi_dir:              "results/{organism}/rgi"
  candidates_file:      "results/{organism}/{antibiotic}/candidates.csv"
  card_layer_dir:       "results/{organism}/{antibiotic}/card_layer"
  # Statistical layers (<layer>.csv: pattern_id, passes) and the grades (14b_grading.py).
  layers_dir:           "results/{organism}/{antibiotic}/layers"
  grades_dir:           "results/{organism}/{antibiotic}/grades"
  # Stability selection (13) and pyseer (14) of one pair.
  cpss_dir:             "results/{organism}/{antibiotic}/cpss"
  pyseer_dir:           "results/{organism}/{antibiotic}/pyseer"
  # Label permutation test of one pair (12b) and the results across models.
  label_permutation_dir: "results/{organism}/{antibiotic}/label_permutation"
  cross_model_dir:      "results/cross_model"
  # AMRFinderPlus and other genotype-based calls of every genome (16): amrfinder_calls.csv
  # (genome_id, element_symbol, type, subtype, scope, class, subclass), amrfinder_genomes.csv.
  external_dir:         "results/{organism}/external"
  # NCBI context of the candidate unitigs (18): cache/ and unitig_context.csv.
  context_dir:          "results/{organism}/context"
  # External validation on CABBAGE (19_cabbage.py; protocol §14 item 4): the release and the
  # eligible external isolates of every organism
  cabbage_data_dir:     "data/external/cabbage"
  cabbage_genomes_dir:  "data/external/cabbage/genomes/{organism}"
  cabbage_dir:          "results/cabbage"
  cabbage_organism_dir: "results/{organism}/cabbage"
  # Reference databases: version, download date and checksums (databases.py, §13).
  databases_manifest:   "data/external/databases.json"
  # Knowledge base (build_kb.py; docs/V1_BILGI_TABANI.md).
  kb_dir:               "results/kb"
  reports_dir:          "results/reports"                        # figures, numbers (reports.py)
  model_reports_dir:    "results/reports/{organism}/{antibiotic}"  # model figures and report
  models_dir:           "models/{organism}/{antibiotic}"
  logs_dir:             "logs/{organism}/{antibiotic}"
  dir_01_data_exploration:   "results/{organism}/{antibiotic}/01_data_exploration"
  dir_03_model_optimization: "results/{organism}/{antibiotic}/03_model_optimization"
  dir_04_evaluation:         "results/{organism}/{antibiotic}/04_evaluation"
  dir_05_explainability:     "results/{organism}/{antibiotic}/05_explainability"
  experiment_config:    "config/experiments/{organism}/config_{antibiotic}.yaml"

  # MLOps run metadata (SCALE_MLOPS_PLAN.md §7)
  run_dir:              "runs/{organism}/{antibiotic}/{run_id}"

# ----------------------------------------------------------------------------
# PROVENANCE (reproducibility / future Knowledge Base — SCALE_MLOPS_PLAN.md §4.1)
# ----------------------------------------------------------------------------
# The analysis protocol in force (docs/V1_PROTOKOL.md, §14 for later changes); the
# knowledge base records it in its release row.
protocol:
  version: "1.0"
  sha256: "b116c2281eeec54f5f64ee030e402cc206a616ad9f4765ece753157b978905fb"

# The frozen environment (plan F6.2): the four Apptainer images that passed the unit and
# end-to-end tests (F5.4, run 20261005T151352; archived with their lock files in
# gdrive:KANIT_v1/containers) and the manifest of the reference databases downloaded on
# 2026-10-04 (scripts/databases.py). A run that is not a stub stops when one differs.
frozen:
  containers:
    container_amr:     "b8802de48ce1e7a5ae3eff605c0edd27c9982be379fcafc82e77144e4c9a6910"
    container_tools:   "90caba9a8de8a2cbe8ed06f36c6819df45855b36667b99b0d21196153dc31343"
    container_pyseer:  "906de490d090c628fa1163a86fd43515d7c0107f0f1b994dbbaff4fba4958c65"
    container_checkm2: "26fc12f5d664d219ac032a7d070de72c47003fe23c610d9f44189f927bb9ef11"
  databases_manifest:  "754e52323e13d1d002cdc0cc315f03d32d7f9af13bc86bacec3440027446e0c4"

# ----------------------------------------------------------------------------
# PANEL (step 02e — lib/panel.py)
# ----------------------------------------------------------------------------
# A pair enters the panel when, after quality control and lineage assignment,
# the smaller of the resistant and susceptible classes holds at least this many
# genomes (five-fold CV then gives each test fold at least 30 on average).
panel:
  min_minority: 150

# ----------------------------------------------------------------------------
# DATA PREPROCESSING PARAMETERS
# ----------------------------------------------------------------------------
preprocessing:
  # Computational resources — LAPTOP-SAFE DEFAULTS, overridden per machine via
  # the environment (lib/config._ENV_RESOURCE_OVERRIDES), NOT by editing this file:
  #     AMR_THREADS=20    # e.g. a TRUBA barbun node (-c40)
  # These are machine size, not science, so they must not be a hand-edit that
  # `git reset --hard` silently reverts on the next deploy.
  threads: 10  # CPU threads               (env: AMR_THREADS)
  chunk_size: 200  # Genomes per matrix chunk (for RAM management)
  
  # Features are binary presence/absence: 03u writes a 0/1 unitig matrix.

# ----------------------------------------------------------------------------
# UNITIG REPRESENTATION
# ----------------------------------------------------------------------------
# Consumed by 03u_unitig_matrix.py. unitig-caller (Bifrost backend) builds the
# population compacted de Bruijn graph of each organism; 03u parses its presence
# table into the organism store (unitig_store_dir) and builds one pattern matrix
# per panel pair (matrix_dir). Formats: lib/matrix_store.py.
unitig:
  # The de Bruijn k of the graph; 03u passes it to unitig-caller as --kmer.
  k: 31
  # Frequency filter, absolute and applied to both sides: a unitig is kept when it
  # is present in at least min_support genomes AND absent from at least
  # min_support. The organism store applies it over all the organism's genomes
  # (a unitig failing there fails in every subset); each model matrix applies it
  # again over the model's genomes.
  min_support: 10
  # unitig-caller thread count. null -> fall back to preprocessing.threads.
  threads: null

# ----------------------------------------------------------------------------
# LINEAGE-AWARE CV (ROADMAP §0.1 M2 — PopPUNK clusters + GroupKFold)
# ----------------------------------------------------------------------------
# 02c runs PopPUNK once per organism (antibiotic-independent) to label each genome
# with a lineage cluster; lib/lineage.py then builds GroupKFold folds so an entire
# lineage stays on one side of train/test (no lineage leakage — ROADMAP §0.1).
lineage:
  # dbscan gives proper strain-level resolution — MEASURED 2026-07-16 under the
  # pinned container with the E3 sketch settings below (k15-35/2), on the
  # re-downloaded genomes. Per-organism results are in the model/refine table
  # further down; E. coli is 294 lineages, largest 860 (15.4%), 94 singletons.
  # (An earlier note here quoted 397 lineages / 14.9% — that was PopPUNK's OWN
  # defaults k13-29/4 during the container check, not the settings we ship.)
  #
  # bgmm was tested and helps nothing: it collapsed E. coli into one ~94%
  # mega-cluster, and on A. baumannii it matched plain dbscan exactly (76.3%).
  #
  # The counts are graph-tool-dependent, which is not obvious and cost a day to
  # learn. PopPUNK 2.7.8 pinned, but rebuilding the container re-solved its
  # network backend graph-tool 2.98 -> 3.0, and the clustering moved: 324 -> 397
  # lineages, 157 -> 234 singletons (ARI 0.990 vs the 2.98 labels). The BACKBONE
  # was untouched — largest lineage identical at 817/14.9%, 4 of the top 5
  # identical — the drift is pure tail fragmentation, so it changes no scientific
  # claim (big lineages intact = the CV property we rely on; singletons never leak).
  # DECISION: accept graph-tool 3.0 (pinned in environment.lock.yml) rather than
  # hold 2.98 back, since every model is being re-populated on it anyway. The
  # numbers above are 3.0's. Re-measure them after ANY container rebuild —
  # scripts/compare_lineage.py exists for exactly that.
  # ── model / refine: chosen by ONE rule, measured across the whole panel ─────
  # 2026-07-16 — largest-lineage fraction (the CV-balance criterion), dbscan vs
  # dbscan+refine, every organism, same container:
  #     organism        no-refine  refine    chosen
  #     E. coli           15.4 %   15.4 %    no-refine (tie)
  #     K. pneumoniae     22.3 %   58.6 %    no-refine   <- refine HARMS it
  #     S. aureus         20.6 %   20.6 %    no-refine (tie)
  #     P. aeruginosa     12.4 %   19.3 %    no-refine
  #     E. faecium        11.4 %    4.2 %    no-refine (refine over-splits:
  #                                           872 lineages / 668 singletons)
  #     A. baumannii      76.3 %   52.1 %    REFINE      <- the only override
  # RULE: dbscan by default; refine only where the default leaves one lineage
  # dominating (>40 %). Uniform rule, per-organism outcome — refine is NOT a
  # universal improvement: it merged K. pneumoniae's high-risk clones into one
  # 58.6 % cluster while splitting A. baumannii's GC2. A. baumannii's override
  # lives in organisms.yaml; this global default serves the other five.
  # bgmm was tested too (A. baumannii 76.3 %, i.e. no different from dbscan).
  # The old note here said "refine on bgmm failed (NaN boundary)" — true, but that
  # was specific to a degenerate bgmm fit; refine runs fine on dbscan everywhere.
  model: "dbscan"        # PopPUNK --fit-model: dbscan | bgmm
  refine: false          # global default; A. baumannii overrides via the registry
  threads: null          # null -> preprocessing.threads

  # ── Sketching (PopPUNK --create-db) — docs/literature/E3.md §3.1 ──────────
  # PopPUNK 2.7.8's OWN defaults are min_k 13 / max_k 29 / k_step 4. E3 recommends
  # 15-35 step 2 for ESKAPEE: short k-mers cause spurious matches, and the wider
  # range costs RAM but resolves strains better. We adopt E3's range for EVERY
  # organism — a panel where some species are clustered on defaults and others on
  # E3 settings would make the cross-organism claim methodologically lame.
  # CHANGING ANY OF THESE RE-CLUSTERS THE ORGANISM: the clustering recorded in
  # data/processed/{org}/lineage/ was produced with a specific setting, and the
  # lineage groups ARE the CV folds. Re-verify lineage_summary after any change.
  min_k: 15
  max_k: 35
  k_step: 2
  sketch_size: 10000     # per-organism override in organisms.yaml (S. aureus 10^5 — read the note there: it is a choice, not a measured requirement)

  # ── Quality control (PopPUNK --qc-db, a SEPARATE mode) — E3 §3.4 ──────────
  # Contamination/length outliers corrupt the distance estimates and can make
  # PopPUNK infer a core distance of 0. MEASURED 2026-07-18: with qc:false the
  # A. baumannii clustering COLLAPSED to a single 96.7% mega-cluster (31 lineages,
  # useless for lineage-CV); qc:true keeps it at 39.5% / 122 lineages. So --qc-db
  # is ESSENTIAL, not redundant with CheckM2 — it guards the distance sketches.
  # CONSEQUENCE: --qc-db drops ~3% of genomes from the cluster labels (1171->1133),
  # and the downstream model MUST drop the same genomes (07b's --drop-uncovered),
  # otherwise a QC-failed genome that still has a phenotype has no lineage and 07b
  # falls back to holdout. QC-failed == low quality, so dropping it from the model
  # is correct, not a workaround.
  qc: true
  max_a_dist: 0.5        # drop pairs with accessory distance above this (E3 §3.4)
  length_sigma: 5        # SD of the length distribution beyond which a genome is cut
  prop_n: 0.1            # max proportion of ambiguous bases
  length_range: null     # [min, max] bp, or null; per-organism (A. baumannii — E3 §5)
  # ── consumed by the CV step (lib/lineage, 06/07b wiring) ──
  n_splits: 5            # StratifiedGroupKFold folds (ROADMAP §0.1: 5-10)
  # NOTE: PopPUNK clusters are used AS-IS — every cluster, singletons included, is
  # its own CV group. There is deliberately no rare-cluster pooling key here: an
  # earlier `min_cluster_size: 10` claimed pooling that no code ever performed.
  # Pooling is also the weaker option (it would force unrelated singletons into one
  # group and thus one fold); see lib/lineage.py.

# ----------------------------------------------------------------------------
# MACHINE LEARNING TRAINING PARAMETERS
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# NESTED CROSS-VALIDATION (lib/folds.py, lib/oof_metrics.py)
# ----------------------------------------------------------------------------
# Two arms (lineage-aware, lineage-blind) x n_repeats x n_folds outer folds.
# Repeat r takes the first seed of 1000*r + j whose every test fold holds at
# least min_minority_per_test_fold genomes of the minority class, trying at most
# max_seed_attempts seeds.
cv:
  n_repeats: 5
  n_folds: 5
  min_minority_per_test_fold: 10
  max_seed_attempts: 20
  threshold: 0.5        # decision threshold; never tuned
  n_bootstrap: 1000     # lineage-cluster bootstrap resamples
  reliability_bins: 10

# ----------------------------------------------------------------------------
# CARD LAYER (08_rgi.py, 09_card_layer.py, lib/card_layer.py)
# ----------------------------------------------------------------------------
card:
  card_json: "data/external/card/card.json"   # the CARD release loaded into RGI
  near_universal: 0.95      # a gene in at least this share of a model's genomes gives no b by homology
  max_located_genomes: 3    # a candidate is located in at most this many carrier genomes
  min_overlap: 0.5          # share of the unitig that must overlap an RGI hit

# ----------------------------------------------------------------------------
# STATISTICAL LAYERS (protocol §8.2–8.3); each writes layers_dir/<layer>.csv
# ----------------------------------------------------------------------------
prevalence:                 # 10_prevalence.py, lib/prevalence.py
  min_delta: 0.10           # |prev(R) - prev(S)|
  alpha: 0.05               # BH-adjusted Fisher exact q over the model's candidates
mda:                        # 12_mda.py, lib/mda.py
  n_permutations: 2000      # R; p = (1 + #{permuted AUC >= observed AUC}) / (R + 1)
  seed: 0                   # the draws of every test fold are seeded by (seed, repeat, fold)
  alpha: 0.05               # BH q over the model's candidates
  cluster_r: 0.9            # sensitivity analysis: |r| that links candidates into one group

cpss:                       # 13_cpss.py, lib/cpss.py (protocol §8.4)
  prefilter: 5000           # patterns with the largest chi2 over all genomes of the model
  n_pairs: 100              # B pairs of disjoint half-samples -> 2B fits
  q: 50                     # patterns a fit selects (highest total gain)
  pi_threshold: 0.6         # stable at this selection frequency or above
  seed: 0                   # pair b is split with the seed (seed, b)
  chunk: 100                # pairs per task: every model's 200 fits in one job (pilot: seconds)
candidates:                 # protocol §7 (written by 13_cpss.py select)
  top_gain: 50              # the final model's patterns with the highest total gain
pyseer:                     # 14_pyseer.py, lib/pyseer_lmm.py (protocol §8.5)
  kinship_every: 100        # every 100th unitig of the model builds the kinship matrix
  alpha: 0.05               # Bonferroni: alpha / number of patterns tested
  background_max: 5000      # λ diagnostic: at most this many unitigs between the kinship sample

context:                    # 18_ncbi_context.py, lib/ncbi_context.py (protocol §12; not evidence)
  word_size: 11
  max_target_seqs: 50       # HITLIST_SIZE of the BLAST URL API
  evalue: 10
  max_members: 10           # a pattern with more members contributes its longest
  batch_size: 100           # unitigs per BLAST submission

packing:                    # lib/packing.py: CV units / permutation chunks of one model per SLURM job
  max_per_job: 20           # a unit keeps about one core busy, whatever its threads (pilot, A. baumannii)
  budget_gb: 170            # memory the units of a job share (labels cv_unit, permutation: 180 GiB)
  base_gb: 4.0              # a unit's memory besides its training matrix (pilot: 2.6-3.9 GB)
  bytes_per_cell: 3.2       # training matrix, per genome × pattern (E. coli probe: 3.06)

cabbage:                    # 19_cabbage.py, lib/cabbage.py (protocol §14 item 4; secondary analysis)
  release: "2026-07"        # EBI AMR Portal release
  url: "https://ftp.ebi.ac.uk/pub/databases/amr_portal/releases/2026-07/phenotype.parquet"
  md5: "d2ccca428bf39462f9ba6aefb33ffdf9"
  min_per_class: 10         # a pair is assessed with at least this many R and S isolates

# Label permutation test of every model (12b_label_permutation.py; protocol §8.6)
label_permutation:
  n_permutations: 100       # R; smallest attainable p = 1/(R + 1)
  seed: 0                   # permutation b is seeded by (seed, b)
  chunk: 10                 # permutations of one fold per task
  alpha: 0.05               # BH q across models; q >= alpha flags permutation_not_significant

# ----------------------------------------------------------------------------
# GRADING RULE (14b_grading.py, lib/grading.py; protocol §9)
# ----------------------------------------------------------------------------
grading:
  rule: allele_aware        # grading_rule reported as `grade`: allele_aware | homolog_only (both stored)

# Hyperparameter search and training of every model (lib/train.py): Optuna TPE
# with a median pruner on up to search_max_genomes genomes; trees by early
# stopping on an inner fifth of the training set, then a refit on all of it.
hpo:
  n_trials: 30
  search_max_genomes: 1000
  pruner_startup_trials: 5    # no pruning before this many trials have completed
  pruner_warmup_rounds: 50    # ... or before this boosting round
  early_stopping_rounds: 50
  max_rounds: 5000
  batch_rows: 128             # rows per batch when building an XGBoost matrix

training:
  # Data splitting (Scale-Invariant Fractional Method)
  random_seed: 42  # For reproducible train/test splits
  test_fraction: 0.20  # Fraction of total chunks reserved for testing (20%)
  validation_fraction: 0.2  # Fraction of training data for early stopping validation
  
  # Hyperparameter optimization
  n_trials: 30  # Number of Optuna optimization trials (upper bound)
  # Early-stopping for HPO: stop once this many COMPLETED trials pass without
  # improving the best score (TPE usually converges early; e.g. the unitig run's
  # best was found by trial ~20). 0/null = run all n_trials. Env override:
  # AMR_OPTUNA_PATIENCE.
  optuna_patience: 15
  optuna_fraction: 0.2  # Fraction of training chunks loaded into RAM during Bayesian opt (20%)
  # The HPO objective is AUC, set via xgboost_params.eval_metric below. An
  # `optimization_metric: auc` key here advertised a choice of auc/accuracy/f1
  # that no code implemented.
  # Parallel HPO (04_optimization.py): run several trials CONCURRENTLY, each
  # XGBoost using this many threads. Optuna n_jobs is derived as
  # (allocated cores // optuna_threads_per_trial) so all cores stay busy on the
  # small HPO subset (avoids low SLURM CPU-efficiency warnings on HPC). Lower =
  # more concurrent trials (e.g. 1 -> one trial per core); higher = fewer, fatter
  # trials. Allocated cores come from SLURM_CPUS_PER_TASK (else os.cpu_count()).
  optuna_threads_per_trial: 2
  # Final training (05_model_training.py): tree count is found by early stopping
  # on a held-out slice of the FULL training set (the HPO-subset n_estimators is
  # too small for full-data training -> underfitting). max_boost_rounds is the
  # early-stopping ceiling; the model then retrains on all train rows with the
  # discovered count.
  max_boost_rounds: 5000
  # Build the train DMatrix in external memory (pages spilled to scratch) so the
  # full matrix fits a 384 GB node. NOTE: raising min_support does
  # NOT shrink RAM (nnz is dominated by common unitigs, not the rare tail it
  # removes). To train IN-CORE (external_memory: false, fast, no low-efficiency
  # warning) the only lever is fewer GENOMES -> see max_train_chunks.
  external_memory: true
  # Optional: train on this many train chunks (stratified subset) instead of all,
  # to shrink nnz enough for in-core training. null = use all chunks. e.g. 12 ≈
  # 2400 genomes (~14B nnz) fits in-core on a 384 GB node; full 18 chunks OOMs.
  max_train_chunks: null

# ----------------------------------------------------------------------------
# XGBOOST MODEL CONFIGURATION
# ----------------------------------------------------------------------------
xgboost_params:
  # Core parameters (fixed during training)
  objective: "binary:logistic"  # Binary classification
  eval_metric: "auc"  # Evaluation metric
  # NOTE: keys in this block are read individually via .get(), not splatted into
  # XGBoost — so an unread key here is silently inert, not a passthrough. A
  # `booster: gbtree` key was exactly that (gbtree is XGBoost's default anyway).
  tree_method: "hist"  # Histogram-based algorithm (faster)
  device: "cpu"  # Computation device (cpu or cuda for GPU)
  verbosity: 1  # 0=silent, 1=warning, 2=info, 3=debug
  n_jobs: 10  # Parallel threads
  
  # Early stopping
  early_stopping_rounds: 50  # Stop if no improvement for N rounds

# ----------------------------------------------------------------------------
# OPTIMIZED HYPERPARAMETERS
# ----------------------------------------------------------------------------
# NOTE: Hyperparameters are now stored in antibiotic-specific config files:
# - config/config_ciprofloxacin.yaml
# - config/config_tetracycline.yaml
# - etc.
#
# These files are auto-generated by 04_optimization.py and contain:
# - Optimization metadata (date, ROC AUC, trials)
# - Fixed XGBoost parameters
# - Best hyperparameters from Optuna optimization
#
# This architecture enables parallel optimization for multiple antibiotics
# without conflicts.

# ----------------------------------------------------------------------------
# ANALYSIS PARAMETERS
# ----------------------------------------------------------------------------
analysis:
  top_n_features: 50  # Number of top features to extract for biological analysis
  stability_threshold: 0.6  # selection_frequency >= this -> "stable" unitig (07b; ROADMAP H1)

  # ── BLAST confidence tiers (step 09) ──────────────────────────────────────
  # Every BLAST hit is graded so weak matches are never presented as findings.
  # For a 21-mer the primary, DB-size-independent criteria are IDENTITY and
  # COVERAGE (alignment length / k); E-value is only a loose secondary gate
  # because it depends on database size (CARD ~MB vs NCBI nt ~TB) and is NOT
  # comparable across the two databases. Thresholds live here (citeable in
  # Methods; ROADMAP Risk-4 / §1.4). Tiers checked best-first: confirmed→candidate→weak.
  #   confirmed : near-exact full-length match to a known ARG
  #   candidate : strong but partial (kept + flagged, NOT dropped)
  #   weak      : reported transparently but flagged; below report_max_evalue dropped
  confidence_tiers:
    confirmed: {min_identity: 95.0, min_coverage: 0.95, max_evalue: 1.0}
    candidate: {min_identity: 90.0, min_coverage: 0.80, max_evalue: 10.0}
    weak:      {min_identity: 80.0, min_coverage: 0.60, max_evalue: 50.0}
  report_max_evalue: 50.0  # hits weaker than this are excluded from the report entirely

# ----------------------------------------------------------------------------
# BLAST ANNOTATION PARAMETERS (Step 08)
# ----------------------------------------------------------------------------
# Used by 08_blast_annotation.py (Python orchestrator) and
# 08_blast_pipeline.nf (Nextflow processes).
#
# CARD Local BLAST:
#   - card_db_dir / card_db_name point to a pre-built blastn database from the
#     Comprehensive Antibiotic Resistance Database (CARD).
#   - Build with: makeblastdb -in card.fna -dbtype nucl -out data/blast_db/card_nt/card
#
# NCBI Remote BLAST:
#   - Uses the NCBI blastn -remote flag. Requires an internet connection.
#   - No local database needed; queries are sent directly to NCBI servers.
blast:
  card_db_dir:  "data/external/blast_db/card_nt"  # Relative to project root (Cookiecutter: external)
  card_db_name: "card"                   # Base name of the blastn database
  evalue:       10                        # E-value threshold for reporting hits
  word_size:    11                        # Seed word size (11 is standard for short seqs)
  threads:      8                         # CPU threads for local BLAST only
  # BLAST -task: null = chosen from the median query length (08 choose_blast_task:
  # 'blastn-short' below 50 bp, otherwise 'blastn'). Set explicitly to override.
  task:         null

  # ── CARD variant/SNP data (step 11 — SNP allele check of the candidate unitigs) ──────
  # NOT shipped with the repo (the bundled card.fna is the homolog model only).
  # Download the full CARD data bundle to get these:
  #   mkdir -p data/external/card && cd data/external/card
  #   wget https://card.mcmaster.ca/latest/data -O card-data.tar.bz2
  #   tar xjf card-data.tar.bz2          # -> card.json + *_variant_model.fasta
  card_variant_fasta: "data/external/card/nucleotide_fasta_protein_variant_model.fasta"
  card_json:          "data/external/card/card.json"
  # CARD ARO ontology index (M16): maps ARO accession -> gene family / drug class /
  # resistance mechanism for the KB. null = auto (aro_index.tsv next to card.json).
  aro_index:          null

# ----------------------------------------------------------------------------
# NCBI ENTREZ PARAMETERS (Step 09 — biological summary)
# ----------------------------------------------------------------------------
# 09_biological_summary.py queries NCBI Entrez efetch to resolve gene names.
# NCBI's Terms of Use REQUIRE a valid contact e-mail; a placeholder address
# (e.g. user@example.com) risks an IP ban. Set your real e-mail below.
# An optional API key raises the rate limit from 3 to 10 requests/sec:
#   https://ncbiinsights.ncbi.nlm.nih.gov/2017/11/02/new-api-keys-for-the-e-utilities/
ncbi:
  entrez_email: "eren0demirbas@gmail.com"    # NCBI Entrez identity (Step 09) — avoids throttling/bans
  api_key:      ""     # OPTIONAL — NCBI API key for a higher rate limit