# ============================================================================
# amr-pyseer.sif — pyseer for KANIT v1.0 (step 14; plan F6, K9)
# ============================================================================
# pyseer 1.4.2 needs glmnet_py other than 1.0.1 and 1.0.2, and the only other
# build (1.0.0) exists for Python 3.8 at the newest. So pyseer keeps Python 3.8 in a
# container of its own, and the rest of the tools move to Python 3.12 (amr-tools).
# It runs only run_pyseer.sh (the pyseer command) and receipt.py (standard library).
#   conda env create -f environment-pyseer.yml
# ============================================================================
name: amr-pyseer
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.8.20
  - pyseer=1.4.2                # LMM association (14)
