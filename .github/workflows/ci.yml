name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff>=0.4 mypy>=1.8

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate registry (organisms/antibiotics consistency)
        run: python scripts/validate_registry.py

      - name: Type-check lib/ (mypy)
        run: mypy

      - name: Run tests (unit + smoke)
        run: pytest -ra
        # Integration/slow tests need the pipeline tools and are opt-in; they
        # run in the maintainer's local/HPC environment, not in CI.

  workflow-stub:
    # The Nextflow workflow with stub tasks: every entry, the wiring of every process,
    # the receipts, the run manifest and the parameter checks (tests/test_workflow_stub.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        env:
          NXF_VER: "25.04.8"
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pytest

      - name: Run the workflow stub tests
        env:
          KANIT_RUN_NEXTFLOW: "1"
          NXF_VER: "25.04.8"
        run: pytest -ra tests/test_workflow_stub.py
